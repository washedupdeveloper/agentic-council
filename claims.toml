# Every claim this project makes, and the command that would falsify it.
#
# `./bin/council-verify` runs them all and exits non-zero if any is false, so
# the documentation and the tree cannot disagree for longer than one run.
# A claim without a check is refused by the loader, not ignored.

[[claim]]
id = "verdict-fails-on-proven-blocking"
text = "A proven high finding fails the run."
check = "python3 -m pytest tests/test_verdict.py::test_a_proven_high_fails -q"

[[claim]]
id = "verdict-medium-does-not-block"
text = "A proven medium finding does not fail the run."
check = "python3 -m pytest tests/test_verdict.py::test_a_proven_medium_passes -q"

[[claim]]
id = "verdict-incomplete-is-not-fail"
text = "An unsettled high finding makes the run incomplete, not failed."
check = "python3 -m pytest tests/test_verdict.py::test_an_unsettled_high_is_incomplete -q"

[[claim]]
id = "registry-rejects-uncheckable"
text = "The registry refuses a claim with no check."
check = "python3 -m pytest tests/test_claims.py::test_a_claim_without_a_check_is_rejected -q"

[[claim]]
id = "base-uses-the-merge-base"
text = "With origin/HEAD, the base is the merge-base, not the tip."
check = "python3 -m pytest tests/test_base.py::test_origin_head_wins_and_uses_the_merge_base -q"

[[claim]]
id = "base-falls-back-to-head-parent"
text = "Without origin/HEAD, the base is HEAD~1."
check = "python3 -m pytest tests/test_base.py::test_without_an_origin_it_falls_back_to_head_tilde_one -q"

[[claim]]
id = "base-refuses-when-there-is-none"
text = "A one-commit repository with no origin refuses instead of guessing."
check = "python3 -m pytest tests/test_base.py::test_one_commit_and_no_origin_refuses -q"

[[claim]]
id = "runs-stay-inside-the-repository"
text = "Run artefacts live at .council/runs inside the checkout."
check = "python3 -m pytest tests/test_paths.py::test_runs_are_inside_the_repository -q"

[[claim]]
id = "a-finding-without-a-proof-is-refused"
text = "The reviewer contract refuses a finding that carries no proof."
check = "python3 -m pytest tests/test_schema.py::test_a_finding_without_a_proof_is_refused -q"

[[claim]]
id = "a-bad-sample-is-retried-once"
text = "A sample that does not parse is retried once, then reported as a failure."
check = "python3 -m pytest tests/test_sample.py::test_a_sample_that_never_parses_reports_why -q"

[[claim]]
id = "the-digest-identifies-the-instrument"
text = "The run digest changes when the prompt or the profile changes."
check = "python3 -m pytest tests/test_prompt.py::test_the_digest_changes_with_the_prompt tests/test_prompt.py::test_the_digest_changes_with_the_profile -q"