[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "council"
version = "2.0.0"
description = "A review is a claim until a check settles it."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6.170.15",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "mcp>=2.3.0,<3",
  "agent-client-protocol>=1.0.0,<2",
]
mcp = ["mcp>=2.3.0,<3"]
acp = ["agent-client-protocol>=1.0.0,<2"]
server = ["mcp>=2.3.0,<3", "agent-client-protocol>=1.0.0,<2"]

[project.scripts]
council = "council.cli:main"
council-verify = "council.claims:main"
council-mcp = "council_mcp:main"
council-acp = "council_acp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
council = ["prompts/*.md", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
show_error_codes = true
