[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "council"
version = "2.0.0"
description = "A review is a claim until a check settles it."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
  "mypy>=1.10",
  "pytest>=8",
  "mcp>=1.29,<2",
  "agent-client-protocol>=0.12,<1",
]
mcp = ["mcp>=1.29,<2"]
acp = ["agent-client-protocol>=0.12,<1"]
server = ["mcp>=1.29,<2", "agent-client-protocol>=0.12,<1"]

[project.scripts]
council = "council.cli:main"
council-verify = "council.claims:main"
council-mcp = "council_mcp:main"
council-acp = "council_acp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
council = ["prompts/*.md", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
show_error_codes = true
