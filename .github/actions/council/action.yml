name: council
description: Review a change with council; bounded by a sample timeout and a run budget.

# A reviewer is a host capability, not something this action installs. Run it on
# a runner that has `hermes` and the `council-generalist` profile.
inputs:
  dist:
    description: Directory holding the council wheel
    required: false
    default: dist
  base:
    description: Revision to diff against (empty means the repository default)
    required: false
    default: ""
  samples:
    description: "Samples per unit (empty means automatic: one clean, two to confirm, three on disagreement)"
    required: false
    default: ""
  require-executed-proofs:
    description: Treat a blocking finding proven only by quotation as incomplete
    required: false
    default: "false"
  allow-single-sample:
    description: Allow one sample; the two-clean rule does not apply
    required: false
    default: "false"
  context-depth:
    description: 0 diff only, 1 enclosing function, 2 +one call level, 3 +two
    required: false
    default: "3"
  sample-timeout:
    description: Seconds one sample may take before it fails
    required: false
    default: "180"
  time-budget:
    description: Seconds after which no new unit is started
    required: false
    default: "600"
  reasoning:
    description: Reasoning effort (empty means the profile's setting)
    required: false
    default: "none"
  stream:
    description: Read the reviewer as JSON events; false for hosts without stream-json
    required: false
    default: "true"
  idle-timeout:
    description: Kill a stream with no event for N seconds
    required: false
    default: "120"
  sarif:
    description: Where to write the SARIF log (empty disables it)
    required: false
    default: "council.sarif"
  baseline:
    description: Committed baseline path, relative to the repository (empty disables it)
    required: false
    default: ""
  allow-rules-change:
    description: Allow the reviewed diff to edit a governing rule document
    required: false
    default: "false"
  python:
    description: Interpreter used to create the private environment
    required: false
    default: python3

runs:
  using: composite
  steps:
    - name: Install the wheel into a private environment
      shell: bash
      env:
        COUNCIL_PYTHON: ${{ inputs.python }}
        COUNCIL_DIST: ${{ inputs.dist }}
      run: |
        set -euo pipefail
        "$COUNCIL_PYTHON" -m venv "$RUNNER_TEMP/council-venv"
        "$RUNNER_TEMP/council-venv/bin/python" -m pip install --disable-pip-version-check \
          "$COUNCIL_DIST"/*.whl

    - name: Check the reviewer before asking it anything
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/council-venv/bin/council" doctor --json

    - name: Review the change
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        SAMPLES: ${{ inputs.samples }}
        REQUIRE_EXECUTED: ${{ inputs.require-executed-proofs }}
        ALLOW_SINGLE_SAMPLE: ${{ inputs.allow-single-sample }}
        REASONING: ${{ inputs.reasoning }}
        STREAM: ${{ inputs.stream }}
        IDLE: ${{ inputs.idle-timeout }}
        SARIF: ${{ inputs.sarif }}
        BASELINE: ${{ inputs.baseline }}
        ALLOW_RULES_CHANGE: ${{ inputs.allow-rules-change }}
        SAMPLE_TIMEOUT: ${{ inputs.sample-timeout }}
        TIME_BUDGET: ${{ inputs.time-budget }}
        CONTEXT_DEPTH: ${{ inputs.context-depth }}
      run: |
        set -uo pipefail
        args=(ci
          --sample-timeout "$SAMPLE_TIMEOUT"
          --time-budget "$TIME_BUDGET"
          --context-depth "$CONTEXT_DEPTH")
        if [ -n "$SAMPLES" ]; then args+=(--samples "$SAMPLES"); fi
        if [ "$ALLOW_SINGLE_SAMPLE" = "true" ] && [ "$SAMPLES" = "1" ]; then args+=(--allow-single-sample); fi
        if [ "$REQUIRE_EXECUTED" = "true" ]; then args+=(--require-executed-proofs); fi
        if [ -n "$BASE" ]; then args+=(--base "$BASE"); fi
        if [ -n "$REASONING" ]; then args+=(--reasoning "$REASONING"); fi
        if [ "$STREAM" = "true" ]; then args+=(--stream); else args+=(--no-stream); fi
        if [ -n "$IDLE" ]; then args+=(--idle-timeout "$IDLE"); fi
        if [ -n "$SARIF" ]; then args+=(--sarif "$SARIF"); fi
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        if [ "$ALLOW_RULES_CHANGE" = "true" ]; then args+=(--allow-rules-change); fi
        "$RUNNER_TEMP/council-venv/bin/council" "${args[@]}"
