name: gate

# The portable gate on a hosted runner: the same checks `nix flake check` runs locally, so a
# push to v2 is verified without waiting for a person. Two jobs, because the cheap checks
# fail fastest and the campaign is most of the cost: `gate` runs the fast tier and then
# everything except the campaign, and `mutations` scores the campaign across four shards.
# `council.yml` beside this one stays manual on purpose — it spends model time and needs a
# self-hosted runner; this spends neither.

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

# One gate per ref: a second push makes the first result irrelevant.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail in seconds, not minutes. Measured on a real defect (an unused import that
  # also moved `__future__`): 11.8 s to a red verdict. The expensive jobs both wait
  # for this one, so a lint error costs 57 s and no campaign is ever started.
  #
  # `--keep-going` inside the app, so every cheap check reports at once instead of
  # one per push. The duplication this costs on a green run -- these four checks are
  # built again in `gate`, which cannot share this runner's store -- was measured at
  # ~6% of the gate's compute, and it buys back four minutes on a red one.
  fast:
    name: fast checks (${{ matrix.system }})
    strategy:
      fail-fast: false
      # Duplicated in `gate` because a matrix cannot be shared between jobs;
      # `tests/test_governance.py` holds the two lists identical.
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # The devshell already carries bwrap, and every job realizes that devshell
          # anyway. `nix shell nixpkgs#bubblewrap` evaluates the registry and fetches a
          # second nixpkgs to run one binary that is already on PATH: measured at 14-17s
          # of the job's setup, across ten jobs, for an answer that is the same either way.
          nix develop -c bwrap --unshare-user --dev-bind / / true \
            && echo "bwrap: usable"
      - name: fast checks
        run: nix run .#gate-fast

  gate:
    name: nix flake check (${{ matrix.system }})
    needs: fast
    # x86_64 only. `aarch64-linux` stays declared in `flake.nix` because the
    # package must still evaluate for a Pi, but it is not gated here: add
    # `ubuntu-24.04-arm` back to this one list to turn the leg on. The runner
    # label is the whole switch; nothing else in this file changes.
    #
    # The gate is a matrix of one today. It stays a matrix so re-adding a system
    # is a one-word edit and not a rewrite of the job.
    strategy:
      fail-fast: false
      # `os` is the runner label; `system` is the Nix system those checks are
      # addressed by. They are two fields because `.#checks.<system>.<name>` needs
      # the Nix name, which is not the runner's. To gate aarch64 again, add one
      # entry and nothing else in this file changes:
      #   - os: ubuntu-24.04-arm
      #     system: aarch64-linux
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, and bubblewrap
      # cannot create a uid map without them: `bwrap: setting up uid map: Permission denied`.
      # Three tests exercise that sandbox for real, so the runner has to be able to run it.
      # `bwrap` being on PATH is not the same as it being usable, which is the distinction
      # that made the first run of this workflow fail.
      - name: allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # `bwrap` is not on the runner's PATH: the tests take it from the Nix build.
          # The devshell already carries bwrap, and every job realizes that devshell
          # anyway. `nix shell nixpkgs#bubblewrap` evaluates the registry and fetches a
          # second nixpkgs to run one binary that is already on PATH: measured at 14-17s
          # of the job's setup, across ten jobs, for an answer that is the same either way.
          nix develop -c bwrap --unshare-user --dev-bind / / true \
            && echo "bwrap: usable"
      # Every check except the campaign, which the shard job owns. `nix flake
      # check` stays the one full gate locally; CI splits only the part that
      # benefits from more machines.
      - name: the gate
        run: nix run .#gate-ci

      # Through the flake, so the validator is the version `flake.lock` pins rather
      # than whatever `npx` resolves at run time.
      - name: validate OpenSpec changes
        run: nix run .#openspec -- validate --all --strict

  # Eight runners instead of four: 72 mutants split by index, each decided by the
  # tests of the claims that name it and falling back to the whole suite when those pass.
  # `--no-baseline` is sound here because this job needs `fast`, which builds the
  # `tests` check on the same commit -- the suite is proven once, not nine times. The union of the shards is the registry, so more of them
  # changes the wall clock and nothing about the proof -- 9 mutants on a 4-core runner
  # instead of 18. Measured: the campaign is 258s of the gate's ~310s, and it is the
  # only step whose cost is per-mutant rather than per-tree.
  mutations:
    name: mutations (shard ${{ matrix.shard }}/8)
    # Waits on the cheap tier only, so it runs beside `gate` rather than after it.
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # The devshell already carries bwrap, and every job realizes that devshell
          # anyway. `nix shell nixpkgs#bubblewrap` evaluates the registry and fetches a
          # second nixpkgs to run one binary that is already on PATH: measured at 14-17s
          # of the job's setup, across ten jobs, for an answer that is the same either way.
          nix develop -c bwrap --unshare-user --dev-bind / / true \
            && echo "bwrap: usable"
      # The same tool the `mutations` check runs; `--shard` partitions the registry
      # by index, so the union of these jobs is exactly the registry, and each job
      # verifies only the claims whose falsifier it owns.
      - name: score this shard
        run: nix develop -c python tools/mutation_check.py --shard ${{ matrix.shard }}/8 --no-baseline
