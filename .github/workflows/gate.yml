name: gate

# The portable gate on a hosted runner: the same `nix flake check` that runs locally, so a
# push to v2 is verified without waiting for a person. `council.yml` beside this one stays
# manual on purpose — it spends model time and needs a self-hosted runner; this spends
# neither.

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

# One gate per ref: a second push makes the first result irrelevant.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, and bubblewrap
      # cannot create a uid map without them: `bwrap: setting up uid map: Permission denied`.
      # Three tests exercise that sandbox for real, so the runner has to be able to run it.
      # `bwrap` being on PATH is not the same as it being usable, which is the distinction
      # that made the first run of this workflow fail.
      - name: allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # `bwrap` is not on the runner's PATH: the tests take it from the Nix build.
          nix shell nixpkgs#bubblewrap -c bwrap --unshare-user --dev-bind / / true \
            && echo "bwrap: usable"
      - run: nix flake check --print-build-logs