name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# Supersede rather than queue. Two pushes in quick succession otherwise run BOTH to
# completion on three OSes plus the nix gate, and the older one's result is thrown away
# when it lands. Grouped by pull-request number where there is one, so each PR cancels
# only its own older runs and never someone else's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The framework is stdlib-only and ships to Windows, macOS and Linux, so the
  # suite must pass on all three with nothing installed but pytest. This job IS
  # the portability guarantee (DECISIONS #2) — if it needs a third-party import,
  # the zero-install promise is already broken. Linux and Windows run on every
  # push; macOS is declared here and enabled by a variable (see below).
  #
  # It is also the most expensive job in quota terms, because macOS minutes count
  # TEN times against the allowance and Windows twice.
  #
  # macOS IS PASSIVE — declared, not built. The suite has been green there, so the
  # portability claim holds; it just does not need re-proving on every push at 10x the
  # quota cost, for a framework with no build step. The switch is a REPOSITORY VARIABLE
  # rather than a commented-out line, so re-enabling needs no edit to this file and
  # cannot rot into a stale comment:
  #
  #   Settings -> Secrets and variables -> Actions -> Variables -> New variable
  #     name:  CI_MATRIX_OSES
  #     value: ["ubuntu-latest","windows-latest","macos-latest"]
  #
  # Unset (the default) means Linux + Windows. Set it and macOS joins the matrix on the
  # next run. To hard-code it instead, replace the `os:` line below with:
  #
  #   os: [ubuntu-latest, windows-latest, macos-latest]
  #
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.CI_MATRIX_OSES || '["ubuntu-latest","windows-latest"]') }}
    steps:
      # PINNED TO A FULL COMMIT SHA, with the version in a comment so a human can
      # read it. A tag is a moving reference: `@v7` runs whatever that tag points at
      # when the job starts, so an upstream force-push or account compromise
      # executes inside this repository's runner. `zizmor` reports a tag as
      # `unpinned-uses` (high) and it is right to — the same finding this framework
      # raises against other projects' workflows.
      #
      # `persist-credentials: false` keeps the checkout token out of `.git/config`,
      # where a later step (or a dependency's install hook) could read it; zizmor
      # calls that class `artipacked`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install pytest
        run: python -m pip install --upgrade pip pytest
      # The job LOG needs admin rights to download, but a step can emit GitHub
      # annotations, and the checks API serves those unauthenticated. So the suite
      # writes junit.xml and the next step turns each failure into an annotation:
      # a Windows-only failure is then readable without a token. The enforcing step
      # is the annotation one, so the job still fails when a test fails.
      - name: run the suite
        run: python -m pytest tests/ -q --junitxml=junit.xml
        continue-on-error: true
      - name: report failing tests as annotations
        if: always()
        shell: python
        run: |
          import pathlib, sys, xml.etree.ElementTree as ET
          report = pathlib.Path("junit.xml")
          if not report.is_file():
              print("::error::junit.xml was not written — the suite did not run")
              sys.exit(1)
          bad = []
          for case in ET.parse(report).getroot().iter("testcase"):
              node = case.find("failure")
              if node is None:
                  node = case.find("error")
              if node is None:
                  continue
              label = f"{case.get('classname', '')}::{case.get('name', '')}"
              detail = (node.get("message") or "").replace("\n", " ")[:250]
              print(f"::error title={label}::{detail}")
              bad.append(label)
          print(f"::notice::failing tests: {len(bad)}")
          sys.exit(1 if bad else 0)

  # The deterministic path: the toolchain pinned by flake.lock, then the repo's
  # own gates.
  #
  # ONE RUNNER, BY DECISION. `systems` declares aarch64-darwin, and the darwin
  # declaration IS checked here — by `nix flake check --all-systems --no-build`,
  # which evaluates every declared system and builds none, so a darwin-only
  # evaluation error fails on Linux. Proven to have teeth rather than assumed: a
  # canary check referencing `pkgs.systemd` (Linux-only) made that command exit 1
  # while a plain `nix flake check` exited 0.
  #
  # What is deliberately NOT paid for: a macOS runner that BUILDS the darwin
  # toolchain. macOS minutes count TEN times against the allowance, the darwin
  # closure is 239 fetched paths and 5 built ones, and the author does not use a
  # Mac. So execution on darwin is left to whoever runs the flake there — one
  # command, the same one this job runs. docs/NIX.md says so from the user's side;
  # adding the runner back is the two lines this comment replaces.
  #
  # NO CUSTOM CACHE. Measured, not assumed: of the toolchain's 238-path closure,
  # 236 are already in cache.nixos.org, which nix uses by default. The only two
  # it cannot fetch are our own `review-council-toolchain` and the python env —
  # both symlinkJoins holding almost no bytes, built in seconds. So CI downloads
  # the tools and builds two directories of symlinks; there is nothing for a
  # private cache to save. See docs/CI.md for how to add one if that changes, and
  # for the self-hosted alternative and what it would take.
  gate:
    name: nix gate (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # composite action: no node runtime, so it is not part of the Node 20
      # deprecation. Pinned to a full SHA for the same reason as the checkout.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: nix flake check (the real gate — builds, does not just evaluate)
        run: nix flake check --keep-going

      # The darwin declaration, checked without a macOS runner. Evaluation only, so
      # it costs seconds and no macOS minutes.
      - name: the darwin declaration evaluates
        run: nix flake check --all-systems --no-build
      - name: the suite under the pinned toolchain
        run: nix develop -c pytest tests/ -q
      - name: lint under the pinned toolchain
        run: nix develop -c ruff check scripts tests

  # The end-to-end proof, and the one job that executes the product as a MACHINE
  # rather than as a tree: a NixOS VM boots, the council is installed into it, a
  # review runs against a stub Hermes, and the gate produces a verdict. It also
  # executes docs/EXTENDING.md's "add a reviewer" procedure and requires the new
  # dimension to move the aggregate.
  #
  # Why not in `nix flake check`: a VM needs /dev/kvm, and a contributor without it
  # would fail the gate for a reason that is not their change. Why it is here at
  # all: until this job existed, `.#vm-test` ran only when a human remembered it,
  # so the strongest claim in docs/MILESTONES.md (M9's acceptance) was the least
  # exercised thing in the repository.
  #
  # GitHub-hosted runners do not expose /dev/kvm, so QEMU falls back to software
  # emulation (TCG). The assertions are identical and the run is simply slower;
  # `nix build -L` is used so the per-step log is visible in the job output.
  e2e:
    name: e2e (NixOS VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: the council end to end, in a real machine
        run: nix build -L .#vm-test

  # The specs are a gate input: a change that does not validate cannot land.
  # Node comes from the runner image, so this job needs no toolchain setup.
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the spec CLI
        run: npm install -g @fission-ai/openspec@1
      - name: the specs validate
        run: openspec validate --all --strict
