name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  # The framework is stdlib-only and ships to Windows, macOS and Linux, so the
  # suite must pass on all three with nothing installed but pytest. This job IS
  # the portability guarantee (DECISIONS #2) — if it needs a third-party import,
  # the zero-install promise is already broken.
  #
  # It is also the most expensive job in quota terms, because macOS minutes count
  # TEN times against the allowance and Windows twice. It is still cheap in wall
  # clock — no nix, no build — so the multiplier is not a problem at this scale.
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # checkout and setup-python must run on Node 24. Node 20 reached EOL in
      # April 2026 and was REMOVED from the runners on 2026-09-23; GitHub then
      # force-runs Node-20 actions on Node 24 and warns on every run. v4/v5 were
      # the Node-20 majors. Pinning the major (not a SHA) is this repo's
      # convention — see docs/CI.md for the SHA-pinning trade-off.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install pytest
        run: python -m pip install --upgrade pip pytest
      # The job LOG needs admin rights to download, but a step can emit GitHub
      # annotations, and the checks API serves those unauthenticated. So the suite
      # writes junit.xml and the next step turns each failure into an annotation:
      # a Windows-only failure is then readable without a token. The enforcing step
      # is the annotation one, so the job still fails when a test fails.
      - name: run the suite
        run: python -m pytest tests/ -q --junitxml=junit.xml
        continue-on-error: true
      - name: report failing tests as annotations
        if: always()
        shell: python
        run: |
          import pathlib, sys, xml.etree.ElementTree as ET
          report = pathlib.Path("junit.xml")
          if not report.is_file():
              print("::error::junit.xml was not written — the suite did not run")
              sys.exit(1)
          bad = []
          for case in ET.parse(report).getroot().iter("testcase"):
              node = case.find("failure")
              if node is None:
                  node = case.find("error")
              if node is None:
                  continue
              label = f"{case.get('classname', '')}::{case.get('name', '')}"
              detail = (node.get("message") or "").replace("\n", " ")[:250]
              print(f"::error title={label}::{detail}")
              bad.append(label)
          print(f"::notice::failing tests: {len(bad)}")
          sys.exit(1 if bad else 0)

  # The deterministic path: the toolchain pinned by flake.lock, then the repo's
  # own gates.
  #
  # ONE RUNNER, BY DECISION. `systems` declares aarch64-darwin, and the darwin
  # declaration IS checked here — by `nix flake check --all-systems --no-build`,
  # which evaluates every declared system and builds none, so a darwin-only
  # evaluation error fails on Linux. Proven to have teeth rather than assumed: a
  # canary check referencing `pkgs.systemd` (Linux-only) made that command exit 1
  # while a plain `nix flake check` exited 0.
  #
  # What is deliberately NOT paid for: a macOS runner that BUILDS the darwin
  # toolchain. macOS minutes count TEN times against the allowance, the darwin
  # closure is 239 fetched paths and 5 built ones, and the author does not use a
  # Mac. So execution on darwin is left to whoever runs the flake there — one
  # command, the same one this job runs. docs/NIX.md says so from the user's side;
  # adding the runner back is the two lines this comment replaces.
  #
  # NO CUSTOM CACHE. Measured, not assumed: of the toolchain's 238-path closure,
  # 236 are already in cache.nixos.org, which nix uses by default. The only two
  # it cannot fetch are our own `review-council-toolchain` and the python env —
  # both symlinkJoins holding almost no bytes, built in seconds. So CI downloads
  # the tools and builds two directories of symlinks; there is nothing for a
  # private cache to save. See docs/CI.md for how to add one if that changes, and
  # for the self-hosted alternative and what it would take.
  gate:
    name: nix gate (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # composite action: no node runtime, so it is not part of the Node 20
      # deprecation. v31 is the current major.
      - uses: cachix/install-nix-action@v31

      - name: nix flake check (the real gate — builds, does not just evaluate)
        run: nix flake check --keep-going

      # The darwin declaration, checked without a macOS runner. Evaluation only, so
      # it costs seconds and no macOS minutes.
      - name: the darwin declaration evaluates
        run: nix flake check --all-systems --no-build
      - name: the suite under the pinned toolchain
        run: nix develop -c pytest tests/ -q
      - name: lint under the pinned toolchain
        run: nix develop -c ruff check scripts tests
